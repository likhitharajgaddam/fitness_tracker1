{% extends "base_public.html" %}

{% block title %}Password Reset Complete | FitTrack{% endblock %}

{% block content %}
<section class="auth-split-wrapper py-5">
  <div class="container-xl">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="surface-card p-4 p-lg-5 text-center shadow-sm">
          <span class="icon-tile mx-auto mb-3" aria-hidden="true">
            <i class="bi bi-check-circle"></i>
          </span>
          <h1 class="h4 fw-bold mb-2">Password Updated</h1>
          <p class="small text-secondary mb-4">
            Your FitTrack password has been reset successfully. You can now sign in with your new credentials.
          </p>
          <a href="{% url 'fitness:login' %}" class="btn btn-emerald w-100">Sign In Now</a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
