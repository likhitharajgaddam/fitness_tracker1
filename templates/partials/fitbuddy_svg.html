<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 110"
  class="fitbuddy-svg {{ extra_class|default:'' }}"
  data-state="{{ buddy_state|default:'idle' }}"
  data-companion="{{ buddy_gender|default:'female' }}"
  style="width: {{ buddy_size|default:'62px' }}; height: {{ buddy_size|default:'68px' }};"
  role="img"
  aria-label="FitBuddy animated fitness companion"
>
  <ellipse cx="50" cy="102" rx="24" ry="5" fill="#1E1B4B" opacity="0.14" />
  <g class="fb-body-group">
    <!-- Left Arm -->
    <g class="fb-arm-left">
      <path d="M27 65 Q13 70 16 82" stroke="#FDBA74" stroke-width="8" stroke-linecap="round" fill="none" />
      <circle cx="16" cy="83" r="4.5" fill="#FDBA74" />
    </g>
    <!-- Right Arm (Waves on greeting/celebration) -->
    <g class="fb-arm-right">
      <path d="M73 65 Q87 56 84 42" stroke="#FDBA74" stroke-width="8" stroke-linecap="round" fill="none" />
      <circle cx="84" cy="40" r="4.5" fill="#FDBA74" />
    </g>

    <!-- Legs & Sneakers -->
    <line x1="41" y1="84" x2="39" y2="96" stroke="#312E81" stroke-width="8" stroke-linecap="round" />
    <line x1="59" y1="84" x2="61" y2="96" stroke="#312E81" stroke-width="8" stroke-linecap="round" />
    <ellipse cx="37" cy="98" rx="7" ry="4" fill="#10B981" />
    <ellipse cx="63" cy="98" rx="7" ry="4" fill="#10B981" />

    <!-- Sporty Outfit Torso -->
    {% if buddy_gender == 'male' %}
    <rect x="29" y="54" width="42" height="34" rx="15" fill="#0EA5E9" />
    <path d="M40 54 L60 54 L54 66 L46 66 Z" fill="#FFFFFF" opacity="0.85" />
    {% else %}
    <rect x="29" y="54" width="42" height="34" rx="15" fill="#7C3AED" />
    <circle cx="50" cy="70" r="5" fill="#34D399" />
    {% endif %}

    <!-- Head -->
    <circle cx="50" cy="36" r="21" fill="#FDBA74" />

    <!-- Hair & Headband -->
    {% if buddy_gender == 'male' %}
    <path d="M30 30 Q38 11 54 14 Q67 16 70 30 Q58 21 30 30 Z" fill="#1E1B4B" />
    <rect x="30" y="24" width="40" height="5.5" rx="2.5" fill="#10B981" />
    {% else %}
    <circle cx="68" cy="24" r="8" fill="#1E1B4B" />
    <path d="M29 31 Q35 12 53 14 Q67 16 71 31 Q55 21 29 31 Z" fill="#1E1B4B" />
    <rect x="30" y="24" width="40" height="5.5" rx="2.5" fill="#F97316" />
    {% endif %}

    <!-- Cheeks -->
    <circle cx="37" cy="40" r="3" fill="#FB7185" opacity="0.45" />
    <circle cx="63" cy="40" r="3" fill="#FB7185" opacity="0.45" />

    <!-- Eyes: Open -->
    <g class="fb-eyes-open">
      <circle cx="42" cy="36" r="2.7" fill="#1E1B4B" />
      <circle cx="58" cy="36" r="2.7" fill="#1E1B4B" />
      <circle cx="43" cy="35" r="0.9" fill="#FFFFFF" />
      <circle cx="59" cy="35" r="0.9" fill="#FFFFFF" />
    </g>

    <!-- Eyes: Happy Arcs -->
    <g class="fb-eyes-happy">
      <path d="M38 36 Q42 31 46 36" stroke="#1E1B4B" stroke-width="2.4" stroke-linecap="round" fill="none" />
      <path d="M54 36 Q58 31 62 36" stroke="#1E1B4B" stroke-width="2.4" stroke-linecap="round" fill="none" />
    </g>

    <!-- Eyes: Sleepy -->
    <g class="fb-eyes-sleepy">
      <path d="M38 37 Q42 40 46 37" stroke="#1E1B4B" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <path d="M54 37 Q58 40 62 37" stroke="#1E1B4B" stroke-width="2.2" stroke-linecap="round" fill="none" />
    </g>

    <!-- Friendly Smile -->
    <path d="M44 44 Q50 50 56 44" stroke="#9A3412" stroke-width="2.3" stroke-linecap="round" fill="none" />

    <!-- Sleepy Zzz -->
    <text class="fb-zzz" x="72" y="18" font-size="9" font-weight="800" fill="#7C3AED">zZ</text>
  </g>
</svg>
