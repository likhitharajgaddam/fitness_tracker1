{% if fitbuddy %}
<div class="fitbuddy-dock" id="fitbuddyDock" data-page="{{ request.resolver_match.url_name|default:'dashboard' }}">
  <div class="fitbuddy-bubble" id="fitbuddyBubble" role="status" aria-live="polite">
    <div class="d-flex justify-content-between align-items-center gap-2 mb-1">
      <span class="fw-bold small text-lime tabular-num">
        FITBUDDY &middot; {{ fitbuddy.companion_name|upper }}
      </span>
      <button
        type="button"
        class="btn btn-sm p-0 border-0 text-ink-muted"
        id="fitbuddyMinimizeBtn"
        aria-label="Minimize FitBuddy message"
        title="Minimize speech bubble"
      >
        <i class="bi bi-dash-lg" aria-hidden="true"></i>
      </button>
    </div>
    <p class="mb-1 fw-semibold text-ink-bright" id="fitbuddyMessage">{{ fitbuddy.message }}</p>
    <div class="text-ink-muted" style="font-size: 0.76rem;" id="fitbuddySubHint">{{ fitbuddy.sub_hint }}</div>
  </div>

  <button
    type="button"
    class="fitbuddy-avatar-btn"
    id="fitbuddyToggleBtn"
    aria-label="Toggle FitBuddy companion speech bubble"
    title="Click to chat with {{ fitbuddy.companion_name }}"
  >
    {% include "partials/fitbuddy_svg.html" with buddy_gender=fitbuddy.companion_key buddy_state=fitbuddy.state buddy_size="44px" extra_class="fitbuddy-floating-svg" %}
    <span class="text-start">
      <span class="d-block fw-bold small lh-1 text-ink-bright">{{ fitbuddy.companion_name }}</span>
      <span class="d-block text-lime tabular-num" style="font-size: 0.68rem;" id="fitbuddyStateLabel">
        {% if fitbuddy.state == 'celebration' %}Celebrating{% elif fitbuddy.state == 'encouragement' %}Cheering{% elif fitbuddy.state == 'workout' %}Training{% elif fitbuddy.state == 'reminder' %}Checking in{% else %}Ready{% endif %}
      </span>
    </span>
  </button>
</div>
{% endif %}
