<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Cricket pitch with bat, ball, and wickets">
  <defs>
    <linearGradient id="cricSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#cricSky)"/>
  <rect x="0" y="198" width="480" height="102" fill="#34D399"/>
  <polygon points="150,198 330,198 410,300 70,300" fill="#FDE68A"/>
  <!-- Stumps / Wickets -->
  <g stroke="#F97316" stroke-width="5" stroke-linecap="round">
    <line x1="336" y1="138" x2="336" y2="212"/>
    <line x1="352" y1="138" x2="352" y2="212"/>
    <line x1="368" y1="138" x2="368" y2="212"/>
  </g>
  <line x1="334" y1="137" x2="370" y2="137" stroke="#78350F" stroke-width="4" stroke-linecap="round"/>
  <!-- Batter -->
  <g transform="translate(138, 66)">
    <ellipse cx="44" cy="176" rx="40" ry="7" fill="#92400E" opacity="0.2"/>
    <line x1="36" y1="114" x2="26" y2="172" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
    <line x1="52" y1="114" x2="64" y2="172" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
    <rect x="26" y="54" width="34" height="62" rx="14" fill="#0EA5E9"/>
    <path d="M56 64 L82 94" stroke="#FDBA74" stroke-width="9" stroke-linecap="round"/>
    <!-- Cricket Bat -->
    <rect x="80" y="90" width="12" height="58" rx="4" transform="rotate(-18 80 90)" fill="#D97706" stroke="#78350F" stroke-width="2"/>
    <circle cx="43" cy="30" r="17" fill="#FDBA74"/>
    <path d="M26 26 Q43 10 60 28" fill="#1E1B4B"/>
  </g>
  <!-- Red Cricket Ball -->
  <circle cx="272" cy="158" r="11" fill="#DC2626"/>
  <path d="M264 152 Q272 158 280 164" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 2" fill="none"/>
</svg>
