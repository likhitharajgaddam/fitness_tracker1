<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Person performing a yoga balance pose">
  <defs>
    <linearGradient id="yogaBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3E8FF"/>
      <stop offset="100%" stop-color="#FFFBF5"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#yogaBg)"/>
  <!-- Calm Aura Circles -->
  <circle cx="240" cy="145" r="108" fill="#DDD6FE" opacity="0.45"/>
  <circle cx="240" cy="145" r="76" fill="#C4B5FD" opacity="0.35"/>
  <!-- Yoga Mat -->
  <polygon points="105,244 375,244 405,274 75,274" fill="#7C3AED"/>
  <polygon points="112,248 368,248 392,270 88,270" fill="#8B5CF6"/>
  <!-- Floating Botanical Leaves -->
  <path d="M84 115 Q102 95 112 118 Q92 128 84 115 Z" fill="#10B981" opacity="0.6"/>
  <path d="M388 102 Q408 86 414 110 Q395 118 388 102 Z" fill="#34D399" opacity="0.65"/>
  <!-- Yoga Tree Pose Figure -->
  <g transform="translate(205, 48)">
    <ellipse cx="35" cy="212" rx="28" ry="6" fill="#4C1D95" opacity="0.2"/>
    <!-- Standing Leg -->
    <line x1="35" y1="126" x2="35" y2="206" stroke="#312E81" stroke-width="13" stroke-linecap="round"/>
    <!-- Bent Leg (Tree Pose) -->
    <path d="M38 130 L68 152 L39 170" stroke="#4338CA" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Torso -->
    <rect x="21" y="68" width="28" height="62" rx="14" fill="#10B981"/>
    <!-- Arms Raised Above Head -->
    <path d="M24 76 Q8 42 35 14" stroke="#FDBA74" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M46 76 Q62 42 35 14" stroke="#FDBA74" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- Head & Bun -->
    <circle cx="35" cy="48" r="16" fill="#FDBA74"/>
    <circle cx="35" cy="29" r="8" fill="#1E1B4B"/>
    <path d="M20 44 Q35 30 50 44" fill="#1E1B4B"/>
    <path d="M29 48 Q32 51 35 48 M38 48 Q41 51 44 48" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M31 55 Q35 58 39 55" stroke="#9A3412" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
