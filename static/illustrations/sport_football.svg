<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Football pitch with soccer ball and player">
  <defs>
    <linearGradient id="footSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#footSky)"/>
  <!-- Pitch -->
  <rect x="0" y="192" width="480" height="108" fill="#10B981"/>
  <rect x="0" y="192" width="480" height="28" fill="#34D399"/>
  <!-- Goal Post -->
  <polyline points="330,192 330,118 446,118 446,192" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
  <rect x="334" y="122" width="108" height="70" fill="#FFFFFF" opacity="0.22"/>
  <!-- Player Kicking -->
  <g transform="translate(135, 68)">
    <ellipse cx="42" cy="166" rx="40" ry="7" fill="#065F46" opacity="0.24"/>
    <line x1="36" y1="108" x2="22" y2="162" stroke="#1E1B4B" stroke-width="13" stroke-linecap="round"/>
    <path d="M46 108 L78 134 L98 124" stroke="#312E81" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="24" y="50" width="32" height="60" rx="13" fill="#0EA5E9"/>
    <path d="M26 58 L4 80" stroke="#FDBA74" stroke-width="9" stroke-linecap="round"/>
    <path d="M54 58 L78 72" stroke="#FDBA74" stroke-width="9" stroke-linecap="round"/>
    <circle cx="40" cy="28" r="16" fill="#FDBA74"/>
    <path d="M25 22 Q40 10 55 22" fill="#1E1B4B"/>
  </g>
  <!-- Soccer Ball -->
  <g transform="translate(262, 182)">
    <circle cx="0" cy="0" r="18" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/>
    <polygon points="0,-7 7,-2 4,6 -4,6 -7,-2" fill="#1E293B"/>
  </g>
</svg>
