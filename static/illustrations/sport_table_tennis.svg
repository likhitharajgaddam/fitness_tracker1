<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Table tennis paddles, net, and ping pong ball">
  <defs>
    <linearGradient id="ttBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#ttBg)"/>
  <!-- Ping Pong Table Perspective -->
  <polygon points="90,152 390,152 448,256 32,256" fill="#0284C7" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="240" y1="152" x2="240" y2="256" stroke="#FFFFFF" stroke-width="3"/>
  <!-- Table Net -->
  <rect x="64" y="180" width="352" height="22" fill="#FFFFFF" opacity="0.65" stroke="#1E293B" stroke-width="2"/>
  <!-- Left Paddle -->
  <g transform="translate(126, 98) rotate(-25)">
    <rect x="-5" y="28" width="10" height="34" rx="4" fill="#D97706"/>
    <ellipse cx="0" cy="0" rx="28" ry="32" fill="#EF4444" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <!-- Right Paddle -->
  <g transform="translate(348, 98) rotate(25)">
    <rect x="-5" y="28" width="10" height="34" rx="4" fill="#D97706"/>
    <ellipse cx="0" cy="0" rx="28" ry="32" fill="#7C3AED" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <!-- Ball Arc & Ball -->
  <path d="M156 96 Q240 42 322 96" stroke="#10B981" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
  <circle cx="240" cy="68" r="11" fill="#FDBA74" stroke="#FFFFFF" stroke-width="2.5"/>
</svg>
