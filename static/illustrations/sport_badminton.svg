<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Badminton player smashing a shuttlecock over a net">
  <defs>
    <linearGradient id="badBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#badBg)"/>
  <!-- Court Floor -->
  <polygon points="0,224 480,224 480,300 0,300" fill="#10B981" opacity="0.22"/>
  <line x1="30" y1="252" x2="450" y2="252" stroke="#FFFFFF" stroke-width="3"/>
  <!-- Badminton Net -->
  <line x1="340" y1="120" x2="340" y2="252" stroke="#1E293B" stroke-width="4"/>
  <rect x="342" y="128" width="124" height="58" fill="#FFFFFF" opacity="0.55" stroke="#64748B" stroke-width="2"/>
  <!-- Shuttlecock -->
  <g transform="translate(278, 66) rotate(-25)">
    <polygon points="0,12 16,0 16,24" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="0" cy="12" r="5" fill="#F97316"/>
  </g>
  <!-- Player + Racket -->
  <g transform="translate(132, 68)">
    <ellipse cx="44" cy="176" rx="40" ry="7" fill="#065F46" opacity="0.18"/>
    <path d="M36 112 L16 146 L4 172" stroke="#312E81" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M48 112 L68 144 L82 170" stroke="#1E1B4B" stroke-width="12" stroke-linecap="round" fill="none"/>
    <rect x="26" y="54" width="32" height="60" rx="14" fill="#7C3AED"/>
    <!-- Racket Arm -->
    <path d="M54 60 L82 32 L98 14" stroke="#FDBA74" stroke-width="9" stroke-linecap="round" fill="none"/>
    <line x1="98" y1="14" x2="118" y2="-8" stroke="#1E293B" stroke-width="4"/>
    <ellipse cx="128" cy="-18" rx="14" ry="20" transform="rotate(40 128 -18)" fill="none" stroke="#0EA5E9" stroke-width="4"/>
    <circle cx="42" cy="30" r="17" fill="#FDBA74"/>
    <path d="M26 24 Q42 10 58 24" fill="#1E1B4B"/>
  </g>
</svg>
