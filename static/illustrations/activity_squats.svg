<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Person performing an athletic squat">
  <defs>
    <linearGradient id="squatBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#squatBg)"/>
  <rect x="84" y="42" width="312" height="206" rx="28" fill="#FFFFFF" opacity="0.65"/>
  <rect x="0" y="236" width="480" height="64" fill="#A7F3D0" opacity="0.5"/>
  <!-- Depth Guide Line -->
  <line x1="150" y1="176" x2="330" y2="176" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.45"/>
  <!-- Squatting Person -->
  <g transform="translate(185, 68)">
    <ellipse cx="52" cy="170" rx="46" ry="7" fill="#065F46" opacity="0.18"/>
    <!-- Left & Right Legs in Deep Squat -->
    <path d="M40 104 L18 134 L30 166" stroke="#1E1B4B" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M58 104 L88 134 L76 166" stroke="#312E81" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <ellipse cx="26" cy="168" rx="12" ry="5" fill="#10B981"/>
    <ellipse cx="82" cy="168" rx="12" ry="5" fill="#10B981"/>
    <!-- Torso -->
    <path d="M44 52 L66 56 L58 108 L36 104 Z" fill="#F97316"/>
    <!-- Arms Extended Forward for Counterbalance -->
    <path d="M60 62 L98 62 L112 58" stroke="#FDBA74" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Head -->
    <circle cx="58" cy="30" r="17" fill="#FDBA74"/>
    <path d="M42 26 Q56 10 74 22" fill="#1E1B4B"/>
    <circle cx="65" cy="30" r="2.2" fill="#1E1B4B"/>
  </g>
</svg>
