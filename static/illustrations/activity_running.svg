<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Runner sprinting on an athletic track">
  <defs>
    <linearGradient id="runSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF1E6"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="runTrack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#runSky)"/>
  <!-- Stadium Curve -->
  <path d="M0 175 Q240 135 480 175 L480 210 L0 210 Z" fill="#DDD6FE"/>
  <rect x="0" y="205" width="480" height="95" fill="url(#runTrack)"/>
  <line x1="0" y1="232" x2="480" y2="232" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="18 10" opacity="0.7"/>
  <line x1="0" y1="262" x2="480" y2="262" stroke="#FFFFFF" stroke-width="2.5" opacity="0.65"/>
  <!-- Speed Lines -->
  <line x1="72" y1="115" x2="132" y2="115" stroke="#7C3AED" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  <line x1="54" y1="142" x2="126" y2="142" stroke="#F97316" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <line x1="88" y1="168" x2="142" y2="168" stroke="#10B981" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <!-- Runner Figure -->
  <g transform="translate(195, 62)">
    <ellipse cx="44" cy="184" rx="44" ry="8" fill="#9A3412" opacity="0.24"/>
    <!-- Back Leg -->
    <path d="M36 122 L8 140 L-12 126" stroke="#1E1B4B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <ellipse cx="-16" cy="124" rx="11" ry="6" transform="rotate(-25 -16 124)" fill="#10B981"/>
    <!-- Front Leg -->
    <path d="M46 122 L78 144 L66 178" stroke="#312E81" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <ellipse cx="72" cy="180" rx="13" ry="6" fill="#10B981"/>
    <!-- Leaning Torso -->
    <path d="M32 58 L60 66 L48 124 L22 118 Z" fill="#0EA5E9"/>
    <path d="M35 58 L58 65 L54 84 L30 78 Z" fill="#7C3AED"/>
    <!-- Arms -->
    <path d="M34 66 L10 82 L24 98" stroke="#FDBA74" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M56 70 L82 64 L90 46" stroke="#FDBA74" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Head + Headband -->
    <circle cx="56" cy="34" r="18" fill="#FDBA74"/>
    <path d="M38 28 Q56 14 72 28" stroke="#7C3AED" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M40 24 Q48 10 66 16" fill="#1E1B4B"/>
    <circle cx="63" cy="35" r="2.3" fill="#1E1B4B"/>
  </g>
</svg>
