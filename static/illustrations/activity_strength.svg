<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Person lifting dumbbells in strength training">
  <defs>
    <linearGradient id="strengthBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#strengthBg)"/>
  <rect x="0" y="232" width="480" height="68" fill="#C7D2FE"/>
  <!-- Gym Rack Silhouette -->
  <rect x="52" y="156" width="84" height="76" rx="8" fill="#A5B4FC" opacity="0.5"/>
  <circle cx="78" cy="182" r="14" fill="#6366F1" opacity="0.5"/>
  <circle cx="110" cy="182" r="14" fill="#6366F1" opacity="0.5"/>
  <!-- Strength Athlete Pressing Dumbbells -->
  <g transform="translate(185, 58)">
    <ellipse cx="55" cy="182" rx="42" ry="7" fill="#312E81" opacity="0.2"/>
    <!-- Legs -->
    <line x1="42" y1="118" x2="34" y2="178" stroke="#1E1B4B" stroke-width="14" stroke-linecap="round"/>
    <line x1="68" y1="118" x2="76" y2="178" stroke="#1E1B4B" stroke-width="14" stroke-linecap="round"/>
    <!-- Torso -->
    <rect x="34" y="54" width="42" height="68" rx="14" fill="#7C3AED"/>
    <!-- Arms Raised with Dumbbells -->
    <path d="M36 62 L14 48 L14 22" stroke="#FDBA74" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M74 62 L96 48 L96 22" stroke="#FDBA74" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Left Dumbbell -->
    <rect x="-2" y="14" width="32" height="7" rx="3" fill="#1E293B"/>
    <rect x="-6" y="7" width="10" height="21" rx="3" fill="#10B981"/>
    <rect x="24" y="7" width="10" height="21" rx="3" fill="#10B981"/>
    <!-- Right Dumbbell -->
    <rect x="80" y="14" width="32" height="7" rx="3" fill="#1E293B"/>
    <rect x="76" y="7" width="10" height="21" rx="3" fill="#10B981"/>
    <rect x="106" y="7" width="10" height="21" rx="3" fill="#10B981"/>
    <!-- Head -->
    <circle cx="55" cy="34" r="17" fill="#FDBA74"/>
    <path d="M39 28 Q55 12 71 28" fill="#1E1B4B"/>
    <circle cx="49" cy="34" r="2" fill="#1E1B4B"/>
    <circle cx="61" cy="34" r="2" fill="#1E1B4B"/>
    <path d="M49 41 Q55 45 61 41" stroke="#9A3412" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
