<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Tennis player rallying on a clay-and-mint court">
  <defs>
    <linearGradient id="tenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#tenBg)"/>
  <polygon points="0,206 480,206 480,300 0,300" fill="#16A34A" opacity="0.78"/>
  <line x1="30" y1="246" x2="450" y2="246" stroke="#FFFFFF" stroke-width="4"/>
  <!-- Tennis Net -->
  <rect x="280" y="162" width="188" height="44" fill="#FFFFFF" opacity="0.55" stroke="#1E293B" stroke-width="2"/>
  <line x1="280" y1="162" x2="468" y2="162" stroke="#FFFFFF" stroke-width="6"/>
  <!-- Neon Tennis Ball -->
