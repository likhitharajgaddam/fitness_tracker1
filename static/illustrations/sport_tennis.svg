    <path d="M36 112 L18 148 L12 168" stroke="#1E1B4B" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M52 112 L72 146 L82 168" stroke="#312E81" stroke-width="12" stroke-linecap="round" fill="none"/>
    <rect x="26" y="54" width="34" height="60" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
    <path d="M56 66 L96 58" stroke="#FDBA74" stroke-width="9" stroke-linecap="round"/>
    <line x1="96" y1="58" x2="116" y2="46" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="132" cy="36" rx="16" ry="22" transform="rotate(55 132 36)" fill="none" stroke="#7C3AED" stroke-width="5"/>
    <circle cx="43" cy="30" r="17" fill="#FDBA74"/>
