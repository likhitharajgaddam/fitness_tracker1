<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Person performing an overhead mobility stretch">
  <defs>
    <linearGradient id="stretchBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBF5"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#stretchBg)"/>
  <circle cx="240" cy="145" r="102" fill="#FDE68A" opacity="0.32"/>
  <rect x="0" y="238" width="480" height="62" fill="#FBCFE8" opacity="0.45"/>
  <!-- Flexibility Arcs -->
  <path d="M168 74 Q240 28 312 74" stroke="#7C3AED" stroke-width="3" stroke-dasharray="7 7" fill="none" opacity="0.5"/>
  <!-- Stretching Figure -->
  <g transform="translate(185, 58)">
    <ellipse cx="54" cy="186" rx="40" ry="7" fill="#9D174D" opacity="0.16"/>
    <!-- Wide Stance Legs -->
    <line x1="48" y1="114" x2="26" y2="182" stroke="#312E81" stroke-width="13" stroke-linecap="round"/>
    <line x1="60" y1="114" x2="86" y2="182" stroke="#4338CA" stroke-width="13" stroke-linecap="round"/>
    <!-- Curved Side-Stretch Torso -->
    <path d="M40 116 Q32 76 58 54 L76 62 Q58 84 64 116 Z" fill="#EC4899"/>
    <!-- Arm Reaching Overhead -->
    <path d="M68 58 Q96 22 48 12" stroke="#FDBA74" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M44 68 L22 96" stroke="#FDBA74" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- Head -->
    <circle cx="62" cy="36" r="16" fill="#FDBA74"/>
    <path d="M48 30 Q62 16 78 28" fill="#1E1B4B"/>
  </g>
</svg>
