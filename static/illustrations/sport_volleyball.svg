<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Volleyball player spiking over the net">
  <defs>
    <linearGradient id="vballBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBF5"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#vballBg)"/>
  <rect x="0" y="226" width="480" height="74" fill="#FDE68A"/>
  <!-- Net -->
  <line x1="296" y1="104" x2="296" y2="256" stroke="#1E293B" stroke-width="5"/>
  <rect x="298" y="108" width="166" height="64" fill="#FFFFFF" opacity="0.65" stroke="#64748B" stroke-width="2"/>
  <line x1="298" y1="108" x2="464" y2="108" stroke="#7C3AED" stroke-width="5"/>
  <!-- Volleyball -->
