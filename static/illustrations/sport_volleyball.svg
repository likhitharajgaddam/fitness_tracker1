    <path d="M36 112 L24 148 L20 166" stroke="#1E1B4B" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M50 112 L62 146 L58 166" stroke="#312E81" stroke-width="12" stroke-linecap="round" fill="none"/>
    <rect x="26" y="54" width="34" height="60" rx="14" fill="#10B981"/>
