<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Person jumping rope indoors">
  <defs>
    <linearGradient id="jumpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#jumpBg)"/>
  <rect x="0" y="238" width="480" height="62" fill="#DDD6FE" opacity="0.6"/>
  <!-- Jump Rope Arc -->
  <path d="M168 152 Q240 280 312 152" stroke="#F97316" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M168 152 Q240 16 312 152" stroke="#FB923C" stroke-width="3" stroke-dasharray="8 8" fill="none" opacity="0.65"/>
  <!-- Bounce Rings -->
  <ellipse cx="240" cy="248" rx="46" ry="8" fill="#7C3AED" opacity="0.22"/>
  <ellipse cx="240" cy="248" rx="68" ry="11" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.3"/>
  <!-- Airborne Jumper -->
  <g transform="translate(202, 52)">
    <!-- Legs tucked slightly in mid-air -->
    <path d="M28 112 L22 144 L28 164" stroke="#1E1B4B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M48 112 L54 144 L48 164" stroke="#312E81" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <ellipse cx="28" cy="166" rx="10" ry="5" fill="#10B981"/>
    <ellipse cx="48" cy="166" rx="10" ry="5" fill="#10B981"/>
    <!-- Torso -->
    <rect x="22" y="54" width="32" height="60" rx="14" fill="#0EA5E9"/>
    <!-- Arms Holding Rope Handles -->
    <path d="M22 64 L-12 88 L-34 98" stroke="#FDBA74" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M54 64 L88 88 L110 98" stroke="#FDBA74" stroke-width="9" stroke-linecap="round" fill="none"/>
    <rect x="-40" y="92" width="12" height="7" rx="3" fill="#7C3AED"/>
    <rect x="104" y="92" width="12" height="7" rx="3" fill="#7C3AED"/>
    <!-- Head -->
    <circle cx="38" cy="30" r="17" fill="#FDBA74"/>
    <path d="M22 25 Q38 10 54 25" fill="#1E1B4B"/>
    <circle cx="32" cy="30" r="2" fill="#1E1B4B"/>
    <circle cx="44" cy="30" r="2" fill="#1E1B4B"/>
    <path d="M33 38 Q38 42 43 38" stroke="#9A3412" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
